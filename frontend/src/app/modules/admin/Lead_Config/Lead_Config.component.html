<div class="ig-page">
  <div class="config-layout">
    <!-- Left Sidebar Menu Slider Component -->
    <app-lead-config-menu-slider
      [isSidebarOpen]="isSidebarOpen"
      [activeSection]="activeSection"
      [activeSubTab]="activeSubTab"
      [expandedSection]="expandedSection"
      (toggle)="toggleSidebar()"
      (sectionSelect)="selectSection($event)"
      (subTabSelect)="selectSubTab($event)">
    </app-lead-config-menu-slider>

    <!-- Right Content Area -->
    <div class="config-content ig-section-card">
      <!-- Tab Content Area -->
      <div class="tab-content">
        <div *ngIf="issLoading" style="text-align: center; padding: 20px;">
          Loading...
        </div>
        <div *ngIf="!issLoading">
          <app-common-table 
            [title]="'Manage ' + activeSubTab"
            [data]="Dropdown_Data" 
            [columns]="columns" 
            [isLoading]="issLoading"
            [pageIndex]="pageIndex"
            [pageSize]="pageSize"
            [totalCount]="totalCount"
            (search)="onSearch($event)"
            (pageChange)="onPageChange($event)"
            (add)="onAdd()"
            (edit)="onEdit($event)"
            (delete)="onDelete($event)">
          </app-common-table>
        </div>
      </div>
    </div>
  </div>
</div>
