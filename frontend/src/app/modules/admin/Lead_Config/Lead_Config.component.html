<div class="ig-page">
  <div class="config-layout">
    <!-- Left Sidebar Menu Slider Component -->
    <app-lead-config-menu-slider
      [isSidebarOpen]="isSidebarOpen"
      [activeSection]="activeSection"
      [activeSubTab]="activeSubTab"
      [expandedSection]="expandedSection"
      (toggle)="toggleSidebar()"
      (sectionSelect)="selectSection($event)"
      (subTabSelect)="selectSubTab($event)">
    </app-lead-config-menu-slider>

    <!-- Right Content Area -->
    <div class="config-content ig-section-card">
      <!-- Tab Content Area -->
      <div class="tab-content">
        <app-common-table 
          [title]="'Manage ' + activeSubTab"
          [data]="Dropdown_Data" 
          [columns]="columns" 
          [isLoading]="issLoading"
          [pageIndex]="pageIndex"
          [pageSize]="pageSize"
          [totalCount]="totalCount"
          [searchText]="searchText"
          [showSubItems]="activeSubTab === 'Market System'"
          (search)="onSearch($event)"
          (pageChange)="onPageChange($event)"
          (add)="onAdd()"
          (edit)="onEdit($event)"
          (delete)="onDelete($event)"
          (subItems)="onSubItems($event)">
        </app-common-table>
      </div>
    </div>
  </div>
</div>

<!-- Modal Dialog for Add / Edit -->
<div class="modal-backdrop" *ngIf="isModalOpen" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;">
  <div class="modal-card" style="background: white; border-radius: 8px; width: 400px; max-width: 90%; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <div class="modal-header" style="display: flex; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid #e2e8f0;">
      <h3 style="margin: 0;">{{ isEditMode ? 'Edit ' + activeSubTab : 'Add New ' + activeSubTab }}</h3>
      <button class="close-btn" style="background: none; border: none; font-size: 20px; cursor: pointer;" (click)="closeModal()">&times;</button>
    </div>
    <div class="modal-body" style="padding: 20px;">
      <div class="form-group" style="margin-bottom: 15px;">
        <label style="display: block; margin-bottom: 5px; font-weight: 500;">Name <span class="text-danger" style="color: red;">*</span></label>
        <input type="text" class="form-control" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box;" [(ngModel)]="formData.name" placeholder="Enter name...">
      </div>
      <div class="form-group" style="margin-bottom: 15px;" *ngIf="hasDescription(activeSubTab)">
        <label style="display: block; margin-bottom: 5px; font-weight: 500;">Description</label>
        <textarea class="form-control" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box;" [(ngModel)]="formData.description" placeholder="Enter description..." rows="3"></textarea>
      </div>
      <div class="form-group" style="display: flex; align-items: center; gap: 8px;" *ngIf="activeSubTab === 'Market System'">
        <input type="checkbox" id="isActiveCheck" [(ngModel)]="formData.IsActive" [checked]="formData.IsActive == 1">
        <label for="isActiveCheck" style="margin: 0; cursor: pointer; font-weight: 500;">Active Status</label>
      </div>
    </div>
    <div class="modal-footer" style="padding: 15px 20px; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 10px;">
      <button class="btn btn-secondary" style="padding: 8px 16px; border: 1px solid #cbd5e1; background: white; border-radius: 4px; cursor: pointer;" (click)="closeModal()">Cancel</button>
      <button class="btn btn-primary" style="padding: 8px 16px; border: none; background: #3b82f6; color: white; border-radius: 4px; cursor: pointer;" (click)="saveItem()" [disabled]="!formData.name || isSaving">
        {{ isSaving ? 'Saving...' : 'Save' }}
      </button>
    </div>
  </div>
</div>

<!-- Modal Dialog for Delete Confirmation -->
<div class="modal-backdrop" *ngIf="isDeleteModalOpen" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;">
  <div class="modal-card" style="background: white; border-radius: 8px; width: 400px; max-width: 90%; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <div class="modal-header" style="display: flex; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid #e2e8f0;">
      <h3 style="margin: 0;">Confirm Deletion</h3>
      <button class="close-btn" style="background: none; border: none; font-size: 20px; cursor: pointer;" (click)="closeDeleteModal()">&times;</button>
    </div>
    <div class="modal-body" style="padding: 20px;">
      <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 10px;">
        <div style="background-color: #fee2e2; color: #ef4444; padding: 10px; border-radius: 50%; display: flex;">
          <i class="material-icons">warning</i>
        </div>
        <div>
          <p style="margin: 0; font-size: 15px; font-weight: 500;">Are you sure you want to delete <strong style="color: #0f172a;">{{ itemToDeleteName }}</strong>?</p>
        </div>
      </div>
      <p style="color: #64748b; font-size: 13px; margin: 0 0 0 55px;">This action cannot be undone and will remove it permanently.</p>
    </div>
    <div class="modal-footer" style="padding: 15px 20px; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 10px;">
      <button class="btn btn-secondary" style="padding: 8px 16px; border: 1px solid #cbd5e1; background: white; border-radius: 4px; cursor: pointer;" (click)="closeDeleteModal()">Cancel</button>
      <button class="btn" style="background-color: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: 500; cursor: pointer;" (click)="confirmDelete()" [disabled]="isDeleting">
        {{ isDeleting ? 'Deleting...' : 'Delete' }}
      </button>
    </div>
  </div>
</div>

<!-- Modal Dialog for Error -->
<div class="modal-backdrop" *ngIf="isErrorModalOpen" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1050;">
  <div class="modal-card" style="background: white; border-radius: 8px; width: 400px; max-width: 90%; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <div class="modal-header" style="display: flex; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid #e2e8f0;">
      <h3 style="margin: 0; color: #ef4444;">Error</h3>
      <button class="close-btn" style="background: none; border: none; font-size: 20px; cursor: pointer;" (click)="closeErrorModal()">&times;</button>
    </div>
    <div class="modal-body" style="padding: 20px;">
      <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 10px;">
        <div style="background-color: #fee2e2; color: #ef4444; padding: 10px; border-radius: 50%; display: flex;">
          <i class="material-icons">error_outline</i>
        </div>
        <div>
          <p style="margin: 0; font-size: 15px; font-weight: 500;">{{ errorMessage }}</p>
        </div>
      </div>
    </div>
    <div class="modal-footer" style="padding: 15px 20px; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end;">
      <button class="btn btn-secondary" style="padding: 8px 16px; border: 1px solid #cbd5e1; background: white; border-radius: 4px; cursor: pointer;" (click)="closeErrorModal()">OK</button>
    </div>
  </div>
</div>
