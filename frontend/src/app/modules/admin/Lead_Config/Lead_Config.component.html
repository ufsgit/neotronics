<div class="ig-page">
  <div class="config-layout">
    <!-- Left Sidebar Menu Slider Component -->
    <app-lead-config-menu-slider
      [isSidebarOpen]="isSidebarOpen"
      [activeSection]="activeSection"
      [activeSubTab]="activeSubTab"
      [expandedSection]="expandedSection"
      (toggle)="toggleSidebar()"
      (sectionSelect)="selectSection($event)"
      (subTabSelect)="selectSubTab($event)">
    </app-lead-config-menu-slider>

    <!-- Right Content Area -->
    <div class="config-content ig-section-card">
      <!-- Tab Content Area -->
      <div class="tab-content">
        <app-common-table 
          [title]="'Manage ' + activeSubTab"
          [data]="Dropdown_Data" 
          [columns]="columns" 
          [isLoading]="issLoading"
          [pageIndex]="pageIndex"
          [pageSize]="pageSize"
          [totalCount]="totalCount"
          [searchText]="searchText"
          [showSubItems]="activeSubTab === 'Market System'"
          (search)="onSearch($event)"
          (pageChange)="onPageChange($event)"
          (add)="onAdd()"
          (edit)="onEdit($event)"
          (delete)="onDelete($event)"
          (subItems)="onSubItems($event)">
        </app-common-table>
      </div>
    </div>
  </div>
</div>

<!-- Modal Dialog for Add / Edit -->
<div class="modal-backdrop" *ngIf="isModalOpen">
  <div class="modal-card">
    <div class="modal-header">
      <h3>{{ isEditMode ? 'Edit ' + activeSubTab : 'Add New ' + activeSubTab }}</h3>
      <button class="close-btn" (click)="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Name <span class="text-danger">*</span></label>
        <input type="text" class="form-control" [(ngModel)]="formData.name" placeholder="Enter name...">
      </div>
      <div class="form-group" style="margin-top: 15px;" *ngIf="hasDescription(activeSubTab)">
        <label>Description</label>
        <textarea class="form-control" [(ngModel)]="formData.description" placeholder="Enter description..." rows="3"></textarea>
      </div>
      <div class="form-group" style="margin-top: 15px; display: flex; align-items: center; gap: 8px;" *ngIf="activeSubTab === 'Market System'">
        <input type="checkbox" id="isActiveCheck" [(ngModel)]="formData.IsActive" [checked]="formData.IsActive == 1">
        <label for="isActiveCheck" style="margin: 0; cursor: pointer;">Active Status</label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="closeModal()">Cancel</button>
      <button class="btn btn-primary" (click)="saveItem()" [disabled]="!formData.name || isSaving">
        {{ isSaving ? 'Saving...' : 'Save' }}
      </button>
    </div>
  </div>
</div>
