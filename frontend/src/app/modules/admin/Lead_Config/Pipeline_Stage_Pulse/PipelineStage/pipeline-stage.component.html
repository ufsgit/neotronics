<app-common-table 
  [title]="'Manage Pipeline Stage'"
  [data]="data" 
  [columns]="columns" 
  [isLoading]="isLoading"
  [pageIndex]="pageIndex"
  [pageSize]="pageSize"
  [totalCount]="totalCount"
  [searchText]="searchText"
  (search)="onSearch($event)"
  (pageChange)="onPageChange($event)"
  (add)="onAdd()"
  (edit)="onEdit($event)"
  (delete)="onDelete($event)">
</app-common-table>

<!-- Add / Edit Modal -->
<div class="modal-backdrop" *ngIf="showModal" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;">
  <div class="modal-card" style="background: white; border-radius: 8px; width: 440px; max-width: 90%; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden;">
    <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid #e2e8f0;">
      <h3 style="margin: 0; font-size: 16px; font-weight: 600; color: #1e293b;">{{ isEdit ? 'Edit Pipeline Stage' : 'Add New Pipeline Stage' }}</h3>
      <button type="button" class="close-btn" style="background: none; border: none; font-size: 20px; cursor: pointer; color: #64748b;" (click)="closeModal()">&times;</button>
    </div>
    
    <div class="modal-body" style="padding: 20px;">
      <!-- Name Field -->
      <div class="form-group" style="margin-bottom: 16px;">
        <label style="display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; color: #334155;">Name <span style="color: #ef4444;">*</span></label>
        <input type="text" class="form-control" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 14px;" [(ngModel)]="formData.name" placeholder="Enter stage name...">
      </div>

      <!-- Stage Type -->
      <div class="form-group" style="margin-bottom: 16px;">
        <label style="display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; color: #334155;">Stage Type</label>
        <select class="form-control" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; background: white; font-size: 14px;" [(ngModel)]="formData.Stage_Type">
          <option [ngValue]="1">won</option>
          <option [ngValue]="2">lost</option>
        </select>
      </div>

      <!-- Follow-up Required -->
      <div class="form-group" style="margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="psFollowupCheck" [(ngModel)]="formData.Followup_Required" [checked]="formData.Followup_Required == 1">
        <label for="psFollowupCheck" style="margin: 0; cursor: pointer; font-weight: 500; font-size: 14px; color: #334155;">Follow-up Required</label>
      </div>

      <!-- Color -->
      <div class="form-group" style="margin-bottom: 16px;">
        <label style="display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; color: #334155;">Color</label>
        <div style="display: flex; align-items: center; gap: 10px;">
          <input type="color" [(ngModel)]="formData.Color" style="width: 42px; height: 38px; padding: 2px; border: 1px solid #cbd5e1; border-radius: 4px; cursor: pointer; background: white;">
          <input type="text" class="form-control" style="flex: 1; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 14px;" [(ngModel)]="formData.Color" placeholder="#3b82f6">
        </div>
      </div>
    </div>

    <div class="modal-footer" style="padding: 15px 20px; border-top: 1px solid #e2e8f0; background: #f8fafc; display: flex; justify-content: flex-end; gap: 10px;">
      <button type="button" class="btn btn-secondary" style="padding: 8px 16px; border: 1px solid #cbd5e1; background: white; border-radius: 4px; cursor: pointer; color: #475569; font-weight: 500;" (click)="closeModal()">Cancel</button>
      <button type="button" class="btn btn-primary" style="padding: 8px 16px; border: none; background: #3b82f6; color: white; border-radius: 4px; cursor: pointer; font-weight: 500;" (click)="saveStage()" [disabled]="!formData.name || isSaving">
        {{ isSaving ? 'Saving...' : 'Save' }}
      </button>
    </div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal-backdrop" *ngIf="isDeleteModalOpen" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;">
  <div class="modal-card" style="background: white; border-radius: 8px; width: 400px; max-width: 90%; box-shadow: 0 4px 6px rgba(0,0,0,0.1); overflow: hidden;">
    <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; border-bottom: 1px solid #e2e8f0;">
      <h3 style="margin: 0; font-size: 16px; font-weight: 600;">Confirm Deletion</h3>
      <button type="button" class="close-btn" style="background: none; border: none; font-size: 20px; cursor: pointer;" (click)="closeDeleteModal()">&times;</button>
    </div>
    <div class="modal-body" style="padding: 20px;">
      <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 10px;">
        <div style="background-color: #fee2e2; color: #ef4444; padding: 10px; border-radius: 50%; display: flex;">
          <i class="material-icons">warning</i>
        </div>
        <div>
          <p style="margin: 0; font-size: 15px; font-weight: 500;">Are you sure you want to delete <strong style="color: #0f172a;">{{ itemToDelete?.name || 'this item' }}</strong>?</p>
        </div>
      </div>
      <p style="color: #64748b; font-size: 13px; margin: 0 0 0 55px;">This action cannot be undone and will remove it permanently.</p>
    </div>
    <div class="modal-footer" style="padding: 15px 20px; border-top: 1px solid #e2e8f0; background: #f8fafc; display: flex; justify-content: flex-end; gap: 10px;">
      <button type="button" class="btn btn-secondary" style="padding: 8px 16px; border: 1px solid #cbd5e1; background: white; border-radius: 4px; cursor: pointer;" (click)="closeDeleteModal()">Cancel</button>
      <button type="button" class="btn" style="background-color: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 4px; font-weight: 500; cursor: pointer;" (click)="confirmDelete()" [disabled]="isDeleting">
        {{ isDeleting ? 'Deleting...' : 'Delete' }}
      </button>
    </div>
  </div>
</div>
