<div class="shared-table-container">
  <div class="table-header">
    <h3 class="table-title">{{ title }}</h3>
    <div class="table-actions">
      <div class="search-box">
        <i class="material-icons search-icon">search</i>
        <input 
          type="text" 
          placeholder="Search..." 
          (input)="onSearchChange($event)"
          [value]="searchTerm">
      </div>
      <button class="btn btn-primary add-btn" (click)="onAdd()">
        <i class="material-icons">add</i> Add New
      </button>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table custom-table">
      <thead>
        <tr>
          <th>#</th>
          <th *ngFor="let col of columns">{{ col.label }}</th>
          <th class="actions-column">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="data.length === 0">
          <td [colSpan]="columns.length + 2" class="text-center no-data">No data found</td>
        </tr>
        <tr *ngFor="let item of data; let i = index">
          <td>{{ (currentPage - 1) * pageSize + i + 1 }}</td>
          <td *ngFor="let col of columns">{{ item[col.key] }}</td>
          <td class="actions-cell">
            <button class="action-btn edit-btn" (click)="onEdit(item)" title="Edit">
              <i class="material-icons">edit</i>
            </button>
            <button class="action-btn delete-btn" (click)="onDelete(item)" title="Delete">
              <i class="material-icons">delete</i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="pagination-container" *ngIf="totalPages > 1">
    <div class="pagination-info">
      Showing {{ (currentPage - 1) * pageSize + 1 }} to {{ Math.min(currentPage * pageSize, totalItems) }} of {{ totalItems }} entries
    </div>
    <ul class="pagination custom-pagination">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button class="page-link" (click)="onPageChange(currentPage - 1)">Previous</button>
      </li>
      
      <!-- We can implement complex pagination (e.g. 1 2 3 ... 10) if needed, but simple one for now -->
      <li class="page-item" *ngFor="let page of [].constructor(totalPages); let i = index" 
          [class.active]="currentPage === i + 1">
        <button class="page-link" (click)="onPageChange(i + 1)">{{ i + 1 }}</button>
      </li>
      
      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <button class="page-link" (click)="onPageChange(currentPage + 1)">Next</button>
      </li>
    </ul>
  </div>
</div>
