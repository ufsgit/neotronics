<div class="ig-dropdown-container" [class.ig-disabled]="disabled">
  <div class="ig-dropdown-toggle ig-input" (click)="toggleDropdown()" [class.open]="isOpen">
    <span class="ig-dropdown-value" *ngIf="value != null && value !== 0 && value !== '' && getDisplayValue()" style="display: inline-flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
      <span *ngIf="getSelectedItem()?.Color" [style.background-color]="getSelectedItem().Color" style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;"></span>
      <span>{{ getDisplayValue() }}</span>
    </span>
    <span class="ig-dropdown-placeholder" *ngIf="value == null || value === 0 || value === '' || !getDisplayValue()">{{ placeholder }}</span>
    <i class="material-icons ig-dropdown-caret">arrow_drop_down</i>
  </div>

  <div class="ig-dropdown-menu" *ngIf="isOpen" [ngStyle]="menuStyle">
    <div class="ig-dropdown-search">
      <input type="text" class="ig-input" placeholder="Type to search..." [value]="searchText" (input)="onSearchChange($event)" (click)="$event.stopPropagation()">
      <i class="material-icons">search</i>
    </div>
    
    <div class="ig-dropdown-list" (scroll)="onScroll($event)">
      <div class="ig-dropdown-item" *ngIf="!data || data.length === 0" style="color: #94a3b8; font-style: italic;" (click)="$event.stopPropagation()">
        No options available
      </div>
      
      <div class="ig-dropdown-item" *ngFor="let item of data" (click)="selectItem(item, $event)" [class.selected]="value === item[bindValue]" style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 8px; overflow: hidden; text-overflow: ellipsis;">
          <span *ngIf="item.Color" [style.background-color]="item.Color" style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;"></span>
          <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ item[bindLabel] }}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0; margin-left: 8px;" *ngIf="item.Stage_Type !== undefined || item.Followup_Required !== undefined">
          <span *ngIf="item.Stage_Type !== undefined && item.Stage_Type !== null" 
                [style.background]="item.Stage_Type == 2 ? '#fef2f2' : (item.Stage_Type == 1 ? '#f0fdf4' : '#f1f5f9')" 
                [style.color]="item.Stage_Type == 2 ? '#ef4444' : (item.Stage_Type == 1 ? '#16a34a' : '#475569')" 
                [style.border]="item.Stage_Type == 2 ? '1px solid #fecaca' : (item.Stage_Type == 1 ? '1px solid #bbf7d0' : '1px solid #cbd5e1')"
                style="font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 10px; text-transform: uppercase;">
            {{ item.Stage_Type == 2 ? 'Lost' : (item.Stage_Type == 1 ? 'Won' : 'Normal') }}
          </span>
          <span *ngIf="item.Followup_Required == 1" 
                style="background: #eff6ff; color: #2563eb; font-size: 10px; font-weight: 500; padding: 1px 4px; border-radius: 4px; display: inline-flex; align-items: center;"
                title="Follow-up Required">
            <i class="material-icons" style="font-size: 12px;">alarm</i>
          </span>
        </div>
      </div>

      <div class="ig-dropdown-loading" *ngIf="loading">
        Loading more...
      </div>
    </div>
  </div>
</div>
