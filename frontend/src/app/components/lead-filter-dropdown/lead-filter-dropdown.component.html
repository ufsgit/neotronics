<div class="ig-lead-dropdown-container">
  <div class="ig-lead-dropdown-trigger" (click)="toggleDropdown($event)">
    <span class="selected-value">{{ selectedOptionName || placeholder }}</span>
    <i class="material-icons">expand_more</i>
  </div>
  
  <div class="ig-lead-dropdown-menu" *ngIf="isOpen" (click)="$event.stopPropagation()">
    <div class="search-container">
      <input #searchInput type="text" placeholder="Search..." [value]="searchTerm" (input)="onSearch($event)" class="search-input">
    </div>
    <div class="options-container" (scroll)="onScroll($event)">
      <div class="option-item" *ngFor="let opt of options" (click)="selectOption(opt, $event)">
        {{ opt.name }}
      </div>
      <div class="option-item loading-text" *ngIf="isLoading">
        Loading...
      </div>
      <div class="option-item no-results" *ngIf="options.length === 0 && !isLoading">
        No options found
      </div>
    </div>
  </div>
</div>
