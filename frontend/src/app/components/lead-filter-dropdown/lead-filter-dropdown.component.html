<div class="ig-lead-dropdown-container">
  <div class="ig-lead-dropdown-trigger" (click)="toggleDropdown($event)">
    <span class="selected-value">{{ selectedOption || placeholder }}</span>
    <i class="material-icons">expand_more</i>
  </div>
  
  <div class="ig-lead-dropdown-menu" *ngIf="isOpen" (click)="$event.stopPropagation()">
    <div class="search-container">
      <input #searchInput type="text" placeholder="Search..." [value]="searchTerm" (input)="onSearch($event)" class="search-input">
    </div>
    <div class="options-container">
      <div class="option-item" *ngFor="let opt of filteredOptions" (click)="selectOption(opt, $event)">
        {{ opt }}
      </div>
      <div class="option-item no-results" *ngIf="filteredOptions.length === 0">
        No results found
      </div>
    </div>
  </div>
</div>
